<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>American League</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=8"></head>
<body><header><div class="brand"><h1>American League</h1><p>2026 Bowling Season</p></div><nav><button class="nav active" data-view="scores">Scores</button><button class="nav" data-view="kill">Kill Cards</button><button class="nav" data-view="winsGame">Games Won</button><button class="nav" data-view="whammyGame">Whammy Counter</button></nav></header>
<main>
<section id="scores" class="view active"><div class="hero"><div><span class="eyebrow">SEASON TRACKER</span><h2>League Scores</h2><p>Tap a week to expand it, then enter scores directly in the boxes.</p></div><div class="record"><b id="wins">0</b><span>Points Won</span></div></div><div id="weeksList" class="weeks-list"><article class="week-card expanded"><button class="week-summary"><strong>Week 1</strong><span>Avg: <b>—</b></span><span>Total Pins: <b>—</b></span><span>Points Won: <b>0</b></span><span>New Avg: <b>—</b></span><i>▲</i></button></article></div><button id="addWeek" class="primary add-week">+ Add Week</button></section>
<section id="kill" class="view"><div class="hero"><div><span class="eyebrow">CARD GAME</span><h2>Kill Cards</h2></div></div><div class="panel"><div class="game-toolbar"><label>Week<input class="gameWeek" type="number" min="1" value="1"></label><button class="loadGame">Load Week</button></div><div id="killChamber" class="chamber"></div></div></section>
<section id="winsGame" class="view"><div class="hero"><div><span class="eyebrow">SEASON RACE</span><h2>Card Game Wins</h2></div></div><div class="panel"><div class="game-toolbar"><label>Week<input class="gameWeek" type="number" min="1" value="1"></label><button class="loadGame">Load Week</button></div><div id="winsButtons" class="counter-grid"></div><div class="chart-wrap"><canvas id="winsChart" width="900" height="430"></canvas></div></div></section>
<section id="whammyGame" class="view"><div class="whammy-hero"><div class="whammy-mark"><div class="whammy-word">WHAMMY!</div></div><div><h2>Whammy Counter</h2></div></div><div class="panel whammy-panel"><div class="game-toolbar"><label>Week<input class="gameWeek" type="number" min="1" value="1"></label><button class="loadGame">Load Week</button></div><div id="whammyButtons" class="counter-grid"></div></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="app.js?v=8"></script></body></html>
